<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Today's Adventure</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <meta name="color-scheme" content="dark">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="sail">

    <header class="head">
      <div class="title-lockup">
        <span class="title-rule" aria-hidden="true"></span>
        <h1>Today's Adventure</h1>
        <span class="title-rule" aria-hidden="true"></span>
      </div>
      <p class="title-detail">A little progress, a long way to go</p>
    </header>

    <div class="cards">

      <!-- ============ TO-DO ============ -->
      <section class="card todo" id="todoCard" aria-labelledby="todoH">
        <div class="card-head">
          <div class="ct">
            <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 6.2l1.2 1.2 2.1-2.4M3.5 12.2l1.2 1.2 2.1-2.4M3.5 18.2l1.2 1.2 2.1-2.4"/></svg></span>
            <h2 id="todoH">Today's To-Do</h2>
          </div>
          <div class="count" id="todoCount">–</div>
        </div>
        <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="todoBar">
          <div class="fill" id="todoFill">
            <img class="hat-sticker" src="assets/straw-hat.png" alt="" aria-hidden="true">
          </div>
        </div>
        <div class="listwrap">
          <ul class="list" id="todoList"></ul>
          <div class="empty" id="todoEmpty" hidden>
            <svg class="stars" viewBox="0 0 48 32" aria-hidden="true"><path class="s1" d="M10 8l1.2 3 3 1.2-3 1.2L10 16.4 8.8 13.4 5.8 12.2l3-1.2z"/><path class="s2" d="M34 5l.9 2.3 2.3.9-2.3.9L34 11.4l-.9-2.3-2.3-.9 2.3-.9z"/><path class="s3" d="M26 18l1.4 3.4 3.4 1.4-3.4 1.4L26 27.6l-1.4-3.4-3.4-1.4 3.4-1.4z"/></svg>
            <div class="et" id="todoEt"></div>
            <div class="es" id="todoEs"></div>
          </div>
        </div>
        <footer class="foot">
          <a id="todoLink" target="_blank" rel="noopener">Open full page ↗</a>
          <span id="todoMore"></span>
        </footer>
      </section>

      <!-- ============ MUST DO'S ============ -->
      <section class="card must" id="mustCard" aria-labelledby="mustH">
        <div class="card-head">
          <div class="ct">
            <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.6 8.4l-2.1 5.1-5.1 2.1 2.1-5.1z"/></svg></span>
            <h2 id="mustH">Must Do's</h2>
          </div>
          <div class="count" id="mustCount">–</div>
        </div>
        <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="mustBar">
          <div class="fill" id="mustFill">
            <img class="hat-sticker" src="assets/straw-hat.png" alt="" aria-hidden="true">
          </div>
        </div>
        <div class="listwrap">
          <ul class="list" id="mustList"></ul>
          <div class="empty" id="mustEmpty" hidden>
            <svg class="stars" viewBox="0 0 48 32" aria-hidden="true"><path class="s1" d="M10 8l1.2 3 3 1.2-3 1.2L10 16.4 8.8 13.4 5.8 12.2l3-1.2z"/><path class="s2" d="M34 5l.9 2.3 2.3.9-2.3.9L34 11.4l-.9-2.3-2.3-.9 2.3-.9z"/><path class="s3" d="M26 18l1.4 3.4 3.4 1.4-3.4 1.4L26 27.6l-1.4-3.4-3.4-1.4 3.4-1.4z"/></svg>
            <div class="et" id="mustEt"></div>
            <div class="es" id="mustEs"></div>
          </div>
        </div>
        <footer class="foot">
          <a id="mustLink" target="_blank" rel="noopener">Open full page ↗</a>
          <span id="mustMore"></span>
        </footer>
      </section>

    </div>

    <div class="sync" id="sync" title=""><i class="dot"></i><span id="syncText">Connecting</span></div>
    <div class="toast" id="toast" role="status" aria-live="polite"><span id="toastText"></span><button type="button" id="toastBtn">Undo</button></div>
  </main>
  <script src="script.js"></script>
</body>
</html>
