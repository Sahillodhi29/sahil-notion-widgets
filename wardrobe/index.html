<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Wardrobe widgets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Rye&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="/wardrobe/theme.js"></script>
  <link rel="stylesheet" href="/wardrobe/style.css">
  <link rel="stylesheet" href="/wardrobe/sanji.css">
</head>
<body>
  <main id="stage">

    <article class="card form-card" data-w="add" hidden></article>

    <article class="card form-card" data-w="wish" hidden></article>

    <article class="card hero" data-w="outfit" hidden>
      <div class="head">
        <div class="title"><h2>Today's outfit</h2><p id="todayDate" class="eyebrow"></p></div>
        <button type="button" id="openBuilder" class="btn primary glow">Add Today's Outfit</button>
      </div>
      <div id="todayBody"></div>
    </article>

    <article class="card" data-w="closet" hidden>
      <div class="head">
        <div class="title"><h2>Wardrobe</h2><p id="wdCount" class="eyebrow"></p></div>
      </div>
      <div class="wd-layout">
        <div id="wdWrap" class="wd-wrap"><div id="wd" class="wd"></div></div>
        <div id="wdInside" class="inside closed"></div>
      </div>
    </article>

    <article class="card" data-w="cats" hidden>
      <div class="head">
        <div class="title"><h2>What's in it</h2><p id="archNote" class="eyebrow"></p></div>
        <div class="seg" role="tablist" aria-label="Group by">
          <button type="button" role="tab" data-by="cat" aria-selected="true">Category</button>
          <button type="button" role="tab" data-by="color" aria-selected="false">Colour</button>
        </div>
      </div>
      <div id="arches" class="bars"></div>
    </article>

    <article class="card" data-w="outfits" hidden>
      <div class="head">
        <div class="title"><h2>Outfits</h2><p id="ofCount" class="eyebrow"></p></div>
        <div class="seg" role="tablist" aria-label="Sort outfits">
          <button type="button" role="tab" data-sort="recent" aria-selected="true">Recent</button>
          <button type="button" role="tab" data-sort="worn" aria-selected="false">Most worn</button>
          <button type="button" role="tab" data-sort="fav" aria-selected="false">Favourites</button>
        </div>
      </div>
      <div id="ofGrid" class="of-grid"></div>
    </article>

    <article class="card" data-w="wishlist" hidden>
      <div class="head">
        <div class="title"><h2>Wishlist</h2><p id="wlTotal" class="eyebrow"></p></div>
      </div>
      <div id="wl" class="wl"></div>
    </article>

    <article class="card" id="bad" hidden></article>
  </main>
  <div id="sheet" class="sheet" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/wardrobe/script.js"></script>
</body>
</html>
