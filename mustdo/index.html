<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Must Do's</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="/mustdo/theme.js"></script>
  <link rel="stylesheet" href="/mustdo/style.css">
  <link rel="stylesheet" href="/mustdo/shanks.css">
</head>
<body>
  <main id="stage">

    <article class="card" data-w="check" hidden>
      <div class="head">
        <div class="ttl"><h2>Must do's</h2><p id="checkDate" class="eyebrow"></p></div>
        <span id="checkCount" class="count">–</span>
      </div>
      <div class="meter" aria-hidden="true"><i id="checkMeter" style="width:0%"></i></div>
      <ul id="checkList" class="list"></ul>
    </article>

    <article class="card" data-w="week" hidden>
      <div class="head">
        <div class="ttl"><h2>This week</h2><p id="weekNote" class="eyebrow"></p></div>
        <span id="weekAvg" class="num">–</span>
      </div>
      <div id="weekChart" class="week"></div>
      <p id="weekFoot" class="small"></p>
    </article>

    <article class="card" data-w="month" hidden>
      <div class="head">
        <div class="ttl"><h2>Last 30 days</h2><p id="monthNote" class="eyebrow"></p></div>
        <span id="monthStreak" class="count"></span>
      </div>
      <div id="monthGrid" class="heat"></div>
      <div class="legend" aria-hidden="true"><span>none</span><i class="l0"></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i><span>all done</span></div>
    </article>

    <article class="card" data-w="manage" hidden>
      <div class="head">
        <div class="ttl"><h2>Your must do's</h2><p id="manageNote" class="eyebrow"></p></div>
      </div>
      <div class="adder">
        <input id="newName" type="text" maxlength="80" autocomplete="off" placeholder="Read 20 pages, no sugar after 8 pm…" aria-label="New must do">
        <button id="addBtn" type="button" class="btn">Add</button>
      </div>
      <ul id="manageList" class="list edit"></ul>
      <p class="small">Removing one takes it out of the database, including its past ticks.</p>
    </article>

    <article class="card" id="bad" hidden></article>
  </main>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/mustdo/script.js"></script>
</body>
</html>
