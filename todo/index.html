<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>To-Do widgets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="/todo/theme.js"></script>
  <link rel="stylesheet" href="/todo/style.css">
  <link rel="stylesheet" href="/todo/chopper.css">
  <script>
    /* Chopper self-check: if the Chopper theme is asked for but a piece did not arrive, say exactly which one, on screen. */
    addEventListener('load', function () {
      var r = document.documentElement, want = new URLSearchParams(location.search).get('theme');
      if (!want) { try { want = localStorage.getItem('todo-theme'); } catch (e) { /* storage blocked */ } }
      if (want !== 'chopper') return;
      var miss = [];
      if (r.dataset.theme !== 'chopper') miss.push('todo/theme.js');
      if (getComputedStyle(r).getPropertyValue('--chopper-css').trim() !== '1') miss.push('todo/chopper.css');
      var done = function () {
        if (!miss.length) return;
        var n = document.createElement('div');
        n.setAttribute('role', 'alert');
        n.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:99;max-width:520px;margin:auto;padding:12px 16px;border-radius:12px;background:#FFF9B7;color:#C8144C;border:2px solid #C8144C;font:700 13.5px/1.4 system-ui,sans-serif;cursor:pointer';
        n.textContent = 'Chopper theme: this did not load: ' + miss.join(', ') + '. Make sure the file is in your repo and deployed, then hard refresh (Ctrl+Shift+R). Tap to dismiss.';
        n.onclick = function () { n.remove(); };
        document.body.appendChild(n);
      };
      var img = new Image(); img.onload = done; img.onerror = function () { miss.push('todo/chopper/ (the pictures)'); done(); }; img.src = '/todo/chopper/hero.webp';
    });
  </script>
</head>
<body>
  <main id="stage">

    <article class="card sweep" data-w="sweep" hidden>
      <section id="swTodo" class="blk todo">
        <div class="sw-top">
          <div><h1>Today's sweep</h1><p id="swDate" class="date"></p></div>
          <p class="sw-count"><span id="swOpen" class="big">–</span><span class="of">to go</span></p>
        </div>
        <div id="swCellsOpen" class="cells" role="img" aria-label="Open tasks, one square each"></div>
      </section>
      <section id="swFin" class="blk fin">
        <p class="sw-count"><span id="swDone" class="big">–</span><span class="of">done</span></p>
        <div class="fin-text"><p id="swLine" class="status"></p><div id="swCellsDone" class="cells" role="img" aria-label="Finished tasks, one square each"></div></div>
      </section>
    </article>

    <article class="card" data-w="general" hidden>
      <div class="head"><div class="ttl"><span class="gico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 6.5l1.4 1.4L8 5.2M4 12.5l1.4 1.4L8 11.2M4 18.5l1.4 1.4L8 17.2M11 6.5h9M11 12.5h9M11 18.5h9"/></svg></span><h2>General</h2></div><span class="cnt" data-count="general"></span></div>
      <div class="pane">
        <div class="rows" data-rows="general"></div>
        <div class="shelf" data-shelf="general"></div>
      </div>
    </article>

    <article class="card" data-w="self" hidden>
      <div class="head"><div class="ttl"><span class="gico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3.5l1.9 5.4 5.4 1.9-5.4 1.9L12 18.1l-1.9-5.4L4.7 10.8l5.4-1.9z"/><path d="M18.5 16.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/></svg></span><h2>Self improvement</h2></div><span class="cnt" data-count="self"></span></div>
      <div class="pane">
        <div class="rows" data-rows="self"></div>
        <div class="shelf" data-shelf="self"></div>
      </div>
    </article>

    <article class="card" data-w="week" hidden>
      <div class="head"><div class="ttl"><span class="gico" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14" rx="2.5"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></svg></span><h2>Next 7 days</h2></div><span id="wkTotal" class="cnt"></span></div>
      <div class="pane">
        <div id="week" class="week"></div>
        <div class="legend" aria-hidden="true"><span><i class="p-High"></i>High</span><span><i class="p-Medium"></i>Medium</span><span><i class="p-Low"></i>Low or none</span></div>
      </div>
    </article>

    <article class="card" data-w="backlog" hidden>
      <div class="head"><div class="ttl"><span class="gico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 13l2.2-7h11.6L20 13v5.5a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18.5z"/><path d="M4 13h4.5l1 2.5h5l1-2.5H20"/></svg></span><h2>Backlog</h2></div><span id="bkNum" class="big bk-num"></span></div>
      <div class="pane">
        <p id="bkLine" class="sub"></p>
        <div id="bkRows" class="rows"></div>
      </div>
    </article>

    <article class="card" data-w="add" hidden>
      <div class="head"><div class="ttl"><span class="gico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span><h2>Quick add</h2></div></div>
      <div class="pane">
        <input id="adTitle" class="in title-in" type="text" maxlength="200" autocomplete="off" placeholder="What needs doing?" aria-label="Task name">
        <div class="fields">
          <div class="fld"><span class="lbl">List</span>
            <div class="seg" data-f="list"><button type="button" data-v="general" aria-pressed="true">General</button><button type="button" data-v="self" aria-pressed="false">Self</button></div></div>
          <div class="fld"><span class="lbl">Priority</span>
            <div class="seg" data-f="priority"><button type="button" data-v="Low" aria-pressed="false">Low</button><button type="button" data-v="Medium" aria-pressed="true">Medium</button><button type="button" data-v="High" aria-pressed="false">High</button></div></div>
          <div class="fld"><span class="lbl">Due</span>
            <div class="seg" data-f="due"><button type="button" data-v="today" aria-pressed="true">Today</button><button type="button" data-v="tomorrow" aria-pressed="false">Tomorrow</button><button type="button" data-v="pick" aria-pressed="false">Pick</button><button type="button" data-v="none" aria-pressed="false">None</button></div>
            <input id="adDate" class="in" type="date" aria-label="Due date" hidden></div>
          <div class="fld"><span class="lbl">Category</span><select id="adCat" class="in" aria-label="Category"></select></div>
          <div class="fld"><span class="lbl">Repeat every</span>
            <div class="rep"><input id="adInt" class="in" type="number" min="1" max="365" inputmode="numeric" placeholder="–" aria-label="Repeat interval"><select id="adUnit" class="in" aria-label="Repeat unit"></select></div></div>
        </div>
        <button id="adGo" class="btn" type="button">Add task</button>
        <span class="sign" aria-hidden="true"></span>
      </div>
    </article>

    <article class="card" id="bad" hidden></article>
  </main>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/todo/script.js"></script>
</body>
</html>
