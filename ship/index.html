<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#1a1a1a">
  <title>Ship Navigation</title>
  <style>html,body{background:#1a1a1a;color-scheme:dark}</style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <div class="stage" id="stage">
      <div class="world" id="world">

        <!-- sky (same recipe as the Sky Banner) -->
        <div class="sky">
          <div class="aurora a1"></div><div class="aurora a2"></div>
          <div class="stars" id="stars"></div>
          <div class="orb sun" id="sun"><div class="halo"></div><div class="disk"></div></div>
          <div class="orb moon" id="moon"><div class="halo"></div><div class="disk"></div></div>
          <div class="clouds" id="clouds"></div>
        </div>

        <!-- sea -->
        <div class="sea" id="sea"><div class="glitter" id="glitter"></div></div>

        <!-- the ship -->
        <svg id="scene" viewBox="0 0 1000 609" preserveAspectRatio="xMidYMid meet" role="group" aria-label="A ship with six spots, one for each of your pages"></svg>

        <div class="sparkles" id="sparkles"></div>
      </div>
      <div class="title"><div class="ttl"><i class="tw l" aria-hidden="true"></i><h1>Where you wanna go?</h1><i class="tw r" aria-hidden="true"></i></div></div>
      <div class="flash" id="flash"></div>
      <a class="fallback" id="fallback" target="_blank" rel="noopener" hidden>Open page ↗</a>
    </div>
    <!-- small screens: the ship is tiny, so also offer plain links -->
    <nav class="list" id="list" aria-label="Pages"></nav>
  </main>
  <script src="art.js"></script>
  <script src="script.js"></script>
</body>
</html>
